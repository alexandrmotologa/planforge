<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="cyan-optics" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="forge-fire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="cyan-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- Architectural Hexagonal Gateway -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="none" stroke="#0f172a" stroke-width="40" stroke-linejoin="round" />

      <polygon points="
        0,-355
        307,-177
        307,177
        0,355
        -307,177
        -307,-177
      " fill="none" stroke="#00f5ff" stroke-width="4" opacity="0.45" stroke-dasharray="16, 12" />

      <!-- Forge Ram: Watertight Base Silhouette -->
      <path d="
        M 0, -260
        C 70, -260 160, -220 220, -170
        C 280, -120 320, -40 310, 50
        C 300, 130 240, 180 180, 190
        C 140, 196 110, 170 120, 130
        C 130, 90 170, 70 180, 30
        C 190, -20 160, -80 110, -110
        L 90, -80
        L 90, 80
        L 50, 180
        L 0, 240
        L -50, 180
        L -90, 80
        L -90, -80
        L -110, -110
        C -160, -80 -190, -20 -180, 30
        C -170, 70 -130, 90 -120, 130
        C -110, 170 -140, 196 -180, 190
        C -240, 180 -300, 130 -310, 50
        C -320, -40 -280, -120 -220, -170
        C -160, -220 -70, -260 0, -260
        Z
      " fill="#0b0f19" />

      <!-- Left Horn Facets (Curved Geometric Waterfall Architecture) -->
      <polygon points="0,-250 -90,-240 -180,-190 -240,-130 -160,-150 -80,-190" fill="#64748b" />
      <polygon points="-180,-190 -240,-130 -290,-40 -220,-60 -160,-150" fill="#475569" />
      <polygon points="-240,-130 -290,-40 -280,60 -210,30 -220,-60" fill="#334155" />
      <polygon points="-290,-40 -280,60 -230,150 -180,110 -210,30" fill="#1e293b" />
      <polygon points="-280,60 -230,150 -160,170 -140,110 -180,110" fill="#0f172a" />
      <polygon points="-230,150 -160,170 -120,120 -140,110" fill="#00f5ff" opacity="0.85" />

      <!-- Right Horn Facets -->
      <polygon points="0,-250 90,-240 180,-190 240,-130 160,-150 80,-190" fill="#94a3b8" />
      <polygon points="180,-190 240,-130 290,-40 220,-60 160,-150" fill="#64748b" />
      <polygon points="240,-130 290,-40 280,60 210,30 220,-60" fill="#475569" />
      <polygon points="290,-40 280,60 230,150 180,110 210,30" fill="#334155" />
      <polygon points="280,60 230,150 160,170 140,110 180,110" fill="#1e293b" />
      <polygon points="230,150 160,170 120,120 140,110" fill="#0284c7" opacity="0.85" />

      <!-- Central Skull Plate (Shield & Anvil geometry) -->
      <polygon points="0,-240 -70,-190 0,-150 70,-190" fill="#334155" />
      <polygon points="0,-150 -70,-190 -85,-90 0,-70" fill="#1e293b" />
      <polygon points="0,-150 70,-190 85,-90 0,-70" fill="#475569" />

      <polygon points="0,-70 -85,-90 -95,-20 0,-30" fill="#0f172a" />
      <polygon points="0,-70 85,-90 95,-20 0,-30" fill="#334155" />

      <!-- Electric Cyan Predator Optics -->
      <polygon points="-85,-40 -40,-45 -25,-25 -70,-20" fill="url(#cyan-optics)" />
      <polygon points="-65,-35 -45,-38 -38,-30 -60,-27" fill="#ffffff" />
      <polygon points="85,-40 40,-45 25,-25 70,-20" fill="url(#cyan-optics)" />
      <polygon points="65,-35 45,-38 38,-30 60,-27" fill="#ffffff" />

      <!-- Bridge of Nose & Muzzle (Obsidian & Titanium facets) -->
      <polygon points="0,-30 -40,-25 -35,70 0,90" fill="#1e293b" />
      <polygon points="0,-30 40,-25 35,70 0,90" fill="#334155" />

      <!-- Nasal Bridge Center Vector -->
      <polygon points="0,-30 -20,20 0,70 20,20" fill="#00f5ff" opacity="0.8" />

      <!-- Muzzle / Anvil Strike Plate -->
      <polygon points="0,90 -35,70 -45,150 0,180" fill="#0f172a" />
      <polygon points="0,90 35,70 45,150 0,180" fill="#1e293b" />

      <!-- Lower Chin / Forge Anvil Base -->
      <polygon points="0,180 -45,150 -30,220 0,240" fill="#0b0f19" />
      <polygon points="0,180 45,150 30,220 0,240" fill="#1e293b" />

      <!-- Forge Spark Diamond at Chin Base -->
      <polygon points="0,210 -15,230 0,250 15,230" fill="url(#forge-fire)" />

    </g>
  </g>
</svg>
